
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Join — Nawab</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/nawab-22.css">

  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 2.25rem;
      backdrop-filter: var(--blur);
      box-shadow: var(--shadow-lg);
    }

    .auth-tabs-row {
      display: flex;
      background: var(--bg-input);
      border-radius: var(--radius-full);
      padding: 0.3rem;
      margin-bottom: 2rem;
    }

    .auth-tab-choice {
      flex: 1;
      padding: 0.6rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border-radius: var(--radius-full);
      transition: all 0.2s ease;
    }

    .auth-tab-choice.active {
      background: var(--accent-primary);
      color: white;
    }

    .form-field {
      margin-bottom: 1.25rem;
    }

    .form-field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-size: 0.92rem;
    }

    .form-input:focus {
      border-color: var(--accent-primary);
    }

    .btn-auth-submit {
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem;
      font-size: 0.95rem;
      justify-content: center;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
      max-width: calc(100vw - 40px);
    }

    .nawab-toast {
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 8px;
      background: #222;
      color: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      overflow-wrap: anywhere;
    }

    .nawab-toast.error {
      background: #842029;
    }

    .nawab-toast.success {
      background: #146c43;
    }

    .nawab-toast.info {
      background: #222;
    }
  </style>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-box">

      <div style="text-align:center; margin-bottom:1.5rem;">
        <div class="brand-logo-social"
             style="justify-content:center; margin-bottom:0.5rem;">
          <div class="brand-icon">
            <svg width="22" height="22" fill="none"
                 stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    d="M13 10V3L4 14h7v7l9-11h-7z">
              </path>
            </svg>
          </div>

          <div class="brand-name-text">
            Nawab<span class="brand-tag-task">SOCIAL</span>
          </div>
        </div>

        <p style="color:var(--text-muted); font-size:0.88rem;">
          Nawab Social Platform
        </p>
      </div>

      <div class="auth-tabs-row">
        <button type="button"
                class="auth-tab-choice active"
                id="tabLogin"
                onclick="switchAuth('login')">
          Sign In
        </button>

        <button type="button"
                class="auth-tab-choice"
                id="tabRegister"
                onclick="switchAuth('register')">
          Create Account
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-field">
          <label for="loginEmail">Email Address</label>
          <input type="email"
                 id="loginEmail"
                 class="form-input"
                 placeholder="demo@nawab.social"
                 autocomplete="username"
                 required>
        </div>

        <div class="form-field">
          <label for="loginPassword">Password</label>
          <input type="password"
                 id="loginPassword"
                 class="form-input"
                 placeholder="Enter your password"
                 autocomplete="current-password"
                 required>
        </div>

        <button type="submit"
                class="btn-publish btn-auth-submit"
                id="btnLoginSubmit">
          Enter Nawab
        </button>
      </form>

      <!-- Registration Form -->
      <form id="registerForm" style="display:none;"
            onsubmit="doRegister(event)">
        <div class="form-field">
          <label for="regName">Full Name</label>
          <input type="text"
                 id="regName"
                 class="form-input"
                 placeholder="e.g. Nawab"
                 autocomplete="name"
                 required>
        </div>

        <div class="form-field">
          <label for="regHandle">Username Handle</label>
          <input type="text"
                 id="regHandle"
                 class="form-input"
                 placeholder="e.g. nawab_dev"
                 autocomplete="username"
                 required>
        </div>

        <div class="form-field">
          <label for="regEmail">Email Address</label>
          <input type="email"
                 id="regEmail"
                 class="form-input"
                 placeholder="you@example.com"
                 autocomplete="email"
                 required>
        </div>

        <div class="form-field">
          <label for="regPassword">Password (min 8 characters)</label>
          <input type="password"
                 id="regPassword"
                 class="form-input"
                 placeholder="Choose a password"
                 minlength="8"
                 autocomplete="new-password"
                 required>
        </div>

        <button type="submit"
                class="btn-publish btn-auth-submit"
                id="btnRegSubmit">
          Create Account
        </button>
      </form>

      <!-- Demo Account Helper -->
      <div style="margin-top:2rem; padding-top:1.25rem;
                  border-top:1px solid var(--border-subtle);
                  text-align:center;">
        <p style="font-size:0.8rem; color:var(--text-muted);
                  margin-bottom:0.6rem;">
          Try the demo account
        </p>

        <button type="button"
                class="btn-follow-toggle"
                onclick="autoFillTester()"
                style="padding:0.45rem 1.25rem;">
          ⚡ Auto-Fill Demo Credentials
        </button>
      </div>

    </div>
  </div>

  <div class="toast-container" id="toastContainer"
       aria-live="polite"></div>

  <!-- Load the API client and authentication state before page handlers -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Toast notification helper
    window.showToast = function (message, type = 'info') {
      const container = document.getElementById('toastContainer');

      if (!container) {
        alert(message);
        return;
      }

      const toast = document.createElement('div');
      toast.className = `nawab-toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => toast.remove(), 4000);
    };

    // Switch between login and registration
    function switchAuth(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabLogin.classList.remove('active');
        tabRegister.classList.add('active');
      }
    }

    // Fill the demo credentials
    function autoFillTester() {
      switchAuth('login');

      document.getElementById('loginEmail').value =
        'demo@nawab.social';

      document.getElementById('loginPassword').value =
        'password123';

      window.showToast(
        'Demo credentials filled. Click Enter Nawab to continue.',
        'info'
      );
    }

    // Login with timeout and visible error reporting
    async function doLogin(e) {
      e.preventDefault();

      const email =
        document.getElementById('loginEmail').value.trim();

      const password =
        document.getElementById('loginPassword').value;

      const btn = document.getElementById('btnLoginSubmit');

      if (!window.api || typeof window.api.login !== 'function') {
        console.error('API client is unavailable or not exposed globally.');
        window.showToast(
          'API client not available. Check js/api.js.',
          'error'
        );
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying...';

      let timeoutId;

      try {
        const timeout = new Promise((_, reject) => {
          timeoutId = setTimeout(
            () => reject(new Error(
              'Login timed out after 10 seconds. Check the backend and API URL.'
            )),
            10000
          );
        });

        const res = await Promise.race([
          window.api.login(email, password),
          timeout
        ]);

        if (res && res.success && res.token) {
          window.auth.setSession(res.token, res.user);
          window.showToast(
            `Welcome back, ${res.user?.name || 'Nawab'}!`,
            'success'
          );

          window.location.href = 'index.html';
          return;
        }

        window.showToast(
          res?.message || 'Login failed. Check the credentials and API response.',
          'error'
        );
      } catch (err) {
        console.error('NAWAB login error:', err);
        window.showToast(
          err.message || 'Unable to log in. Check the backend connection.',
          'error'
        );
      } finally {
        clearTimeout(timeoutId);
        btn.disabled = false;
        btn.textContent = 'Enter Nawab';
      }
    }

    // Register a new account
    async function doRegister(e) {
      e.preventDefault();

      const name =
        document.getElementById('regName').value.trim();

      const handle =
        document.getElementById('regHandle').value.trim();

      const email =
        document.getElementById('regEmail').value.trim();

      const password =
        document.getElementById('regPassword').value;

      const btn = document.getElementById('btnRegSubmit');

      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const res = await window.api.register({
          name,
          handle,
          email,
          password
        });

        if (res && res.success && res.token) {
          window.auth.setSession(res.token, res.user);
          window.showToast('Account created successfully!', 'success');
          window.location.href = 'index.html';
          return;
        }

        window.showToast(
          res?.message || 'Registration failed.',
          'error'
        );
      } catch (err) {
        console.error('NAWAB registration error:', err);
        window.showToast(
          err.message || 'Server connection error.',
          'error'
        );
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
